name: build-fabulinux-live-iso
# Gera uma ISO LIVE (bootável para experimentar antes de instalar) do Fabulinux
# a partir da imagem publicada em ghcr, usando o Titanoboa (ublue-os/titanoboa).
# Card #21 (Fase 2). Diferente do build-iso.yml, que gera só o instalador Anaconda.
#
# NÃO exige segredos (sem cosign): apenas puxa a imagem pública/privada de ghcr.
# Como o Titanoboa roda etapas via `sudo`, autenticamos o root no ghcr (a imagem
# ainda é privada) — mesmo padrão do build-iso.yml.

on:
  workflow_dispatch: {} # gerar a Live ISO manualmente pela aba Actions
  workflow_run:
    workflows: ["build-fabulinux-image"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-live-iso.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false

env:
  IMAGE_NAME: fabulinux
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: latest

jobs:
  build-live-iso:
    name: Gerar Live ISO
    runs-on: ubuntu-24.04
    # Se disparado por workflow_run (após o build da imagem), só segue em caso de sucesso.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximizar espaço de build
        uses: ublue-os/remove-unwanted-software@v9
        with:
          remove-codeql: true

      - name: Login em ghcr (usuário do runner)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # O Titanoboa puxa a imagem privada tanto como usuário do runner quanto via
      # sudo (root). Autenticamos os DOIS contextos de podman para o pull não dar
      # "image not known".
      - name: Login no ghcr (usuário e root)
        run: |
          podman login ghcr.io -u "${{ github.actor }}" --password "${{ github.token }}"
          sudo podman login ghcr.io -u "${{ github.actor }}" --password "${{ github.token }}"

      - name: Normalizar registry para minúsculas
        run: echo "IMAGE_REGISTRY=$(echo "${IMAGE_REGISTRY}" | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_ENV}"

      - name: Build da Live ISO (Titanoboa)
        id: build
        uses: ublue-os/titanoboa@main
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          iso-dest: ${{ github.workspace }}/output/fabulinux-live.iso

      - name: Publicar Live ISO como artefato
        uses: actions/upload-artifact@v4
        with:
          name: fabulinux-live-iso
          path: ${{ steps.build.outputs.iso-dest }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
