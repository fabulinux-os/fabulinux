name: build-fabulinux-iso
# Gera a ISO instalável (Anaconda) do Fabulinux a partir da imagem já
# publicada em ghcr por build.yml, usando o bootc-image-builder oficial
# (osbuild/bootc-image-builder-action) — o mesmo mecanismo usado pelo
# template oficial `ublue-os/image-template`. Card #17, Fase 2.
#
# PRÉ-REQUISITO: build.yml precisa ter rodado com sucesso pelo menos uma vez
# e publicado `ghcr.io/fabulinux-os/fabulinux:latest` antes deste workflow
# funcionar — ver fase2/NOTAS-pipeline.md para a ordem completa.
#
# Assim como build.yml, este workflow NÃO exige nenhum secret de cosign: só
# faz `podman pull`/build da imagem pública em ghcr, sem verificar assinatura.

on:
  workflow_run:
    workflows: ["build-fabulinux-image"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {} # permite gerar a ISO manualmente pela aba Actions
  push:
    branches: [main]
    paths:
      - "fase2/bluebuild/disk_config/**"
      - ".github/workflows/build-iso.yml"

env:
  IMAGE_NAME: fabulinux
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: latest
  BIB_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Gerar ISO instalável
    runs-on: ubuntu-24.04
    # Se disparado por workflow_run (após build.yml), só segue se o build da
    # imagem tiver terminado com sucesso.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximizar espaço de build
        uses: ublue-os/remove-unwanted-software@v9
        with:
          remove-codeql: true

      - name: Login em ghcr (leitura da imagem já publicada)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # O bootc-image-builder roda via `sudo` (root), que NÃO herda o login
      # acima (feito para o usuário do runner). Sem isto, o pull da imagem
      # privada em ghcr falha com "unauthorized / image not known".
      - name: Login do root no ghcr
        run: sudo podman login ghcr.io -u "${{ github.actor }}" --password "${{ github.token }}"

      - name: Preparar variáveis de ambiente
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          echo "IMAGE_REGISTRY=$(echo "${IMAGE_REGISTRY}" | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_ENV}"
          echo "USER_UID=${USER_UID}" >> "${GITHUB_ENV}"
          echo "USER_GID=${USER_GID}" >> "${GITHUB_ENV}"

      - name: Build da ISO (bootc-image-builder)
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./fase2/bluebuild/disk_config/iso.toml
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: anaconda-iso

      # Saída: artefato do próprio run do Actions. Baixar em Actions > este
      # run > "Artifacts" (fica disponível por 30 dias, ver NOTAS-pipeline.md
      # para a opção de publicar como GitHub Release em vez de artefato).
      - name: Publicar ISO como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: fabulinux-iso
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
