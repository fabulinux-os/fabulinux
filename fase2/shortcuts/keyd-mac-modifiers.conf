# fase2/shortcuts/keyd-mac-modifiers.conf
#
# Faz a tecla ⌘ (Meta/Super) funcionar como Ctrl para copiar/colar/etc,
# igual no Mac — coisa que NENHUM arquivo de atalho do KDE consegue
# fazer sozinho (ver NOTAS.md, seção "por que isso não é só KDE").
#
# Ferramenta: keyd (https://github.com/rvaiya/keyd) — daemon de baixo
# nível (lê o teclado direto do evdev, antes do Wayland/X11), por isso
# funciona igual em app KDE, GTK, Electron, terminal, tudo. Não é uma
# configuração do Plasma; é um serviço de sistema à parte.
#
# Instalação (varia pela base atômica escolhida no card #9 — em muitas
# distros: `sudo pacman -S keyd` / `sudo dnf install keyd` / `sudo apt
# install keyd`). Depois:
#   sudo cp keyd-mac-modifiers.conf /etc/keyd/default.conf
#   sudo systemctl enable --now keyd
# Para aplicar mudanças depois de editar, não precisa reiniciar a sessão:
#   sudo systemctl restart keyd
#
# [ids] * = aplica a todos os teclados detectados.
[ids]
*

# keyd já trata a tecla Meta/Super como uma "camada" (layer) chamada
# [meta] por padrão — todo Meta+tecla que a gente NÃO listar aqui passa
# direto como Meta+tecla de sempre. Isso é importante: Meta+Espaço e
# Meta+Tab (definidos em kglobalshortcutsrc, nesta mesma pasta) e o
# toque isolado de ⌘ continuam chegando normalmente ao KDE. Só as
# teclas abaixo é que passam a sair como Ctrl+tecla.
[meta]

# Copiar / Colar / Recortar / Desfazer — o pedido central do card.
c = C-c
v = C-v
x = C-x
z = C-z

# Extras de mesma família, comuns no dia a dia estilo Mac (remova
# qualquer linha se preferir manter o escopo só em C/V/X/Z).
a = C-a
s = C-s
f = C-f
