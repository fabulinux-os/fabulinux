# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
#
# Receita BlueBuild do Fabulinux (Card #17, Fase 2).
# Referências de decisão: fase2/docs/decisoes-produto.md e fase2/docs/escolha-base.md.
#
# Base: Fedora Kinoite (KDE Plasma 6, imutável via rpm-ostree/bootc) + codecs,
# através da imagem `kinoite-main` da Universal Blue — ver escolha-base.md.
name: fabulinux
description: >-
  Fabulinux — distro Linux para criativos: base Fedora Kinoite (KDE Plasma
  6, imutável), codecs completos + VLC, e apps via Flatpak.

# Imutabilidade forte (composefs + fs-verity, rollback atômico) é HERDADA da
# base `kinoite-main` sem nenhuma alteração aqui — nenhum módulo desta receita
# desativa o modo somente-leitura, e nada exige "layering" em runtime pelo
# usuário: toda customização acontece em build-time, nesta receita, conforme
# fase2/docs/decisoes-produto.md, seção 1.
base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest # Segue o kinoite-main mais recente (hoje Fedora 44). NÃO fixar em tag numérica: a ublue remove tags antigas (a `42` sumiu e quebrou o build); `latest` não some.

modules:
  # Codecs / multimídia: HERDADOS da base `kinoite-main`, que já vem com ffmpeg
  # completo, GStreamer e aceleração de vídeo por hardware (VA-API/mesa-freeworld).
  # Por isso NÃO fazemos layering rpm-ostree aqui — o que:
  #   (a) mantém a imutabilidade máxima (decisoes-produto.md, seções 1 e 2 —
  #       zero layering, tudo via imagem/Flatpak); e
  #   (b) evita depender de repositórios de terceiros no build. (O repo
  #       "fedora-multimedia"/negativo17 que a base traz chegou a retornar 404
  #       para o Fedora 42, quebrando qualquer transação rpm-ostree.)
  # O VLC entra como Flatpak, junto dos demais apps (ele já embute seus codecs).

  # --- Flatpaks padrão (fase2/docs/decisoes-produto.md, seções 1 e 4) ---
  #
  # Curadoria completa dos IDs em `fase2/flatpak/apps.list` (card #6, ainda em
  # PR #13 no momento em que este card foi escrito — os mesmos 21 IDs estão
  # replicados aqui; se o card #6 mudar algum ID, sincronizar aqui também).
  # Apps do usuário SEMPRE via Flatpak, nunca tocando a base (seção 1).
  #
  # Tier mínimo (2 núcleos/4 GB — seção 4): os apps pesados de vídeo/3D ficam
  # DE FORA do `install:` por padrão. Como o Flathub já fica habilitado por
  # este módulo, eles continuam instaláveis a qualquer momento pela loja de
  # apps (Discover), sob demanda do usuário — sem tocar a base imutável.
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        install:
          # Núcleo ENXUTO para o primeiro boot ("não precisa todos de cara").
          # O resto da curadoria fica a 1 clique na loja (Discover/Flathub).
          - org.mozilla.firefox            # navegador
          - org.gnome.Geary                # e-mail simples
          - org.onlyoffice.desktopeditors  # escritório
          - org.kde.krita                  # design/ilustração (carro-chefe)
          - org.videolan.VLC               # mídia (embute seus codecs)
          - md.obsidian.Obsidian           # notas/escrita
          - org.gnome.FontManager          # gerenciar fontes
          #
          # --- Disponíveis sob demanda na loja (NÃO pré-instalados) ---
          # Design/foto: org.gimp.GIMP · org.inkscape.Inkscape · net.scribus.Scribus
          #              org.darktable.Darktable · com.rawtherapee.RawTherapee · org.kde.digikam
          # Áudio:       io.lmms.LMMS · org.ardour.Ardour · org.mixxx.Mixxx · org.audacityteam.Audacity
          # Vídeo/3D:    org.blender.Blender · org.kde.kdenlive · com.obsproject.Studio · fr.handbrake.ghb
          # (org.kde.okular já vem na base KDE)

  # --- Live ISO: config do Titanoboa (card #21) ---
  # O Titanoboa exige /usr/lib/bootc-image-builder/iso.yaml DENTRO da imagem
  # (define o rótulo da ISO e as entradas do GRUB do live). Escrito via snippet
  # para ficar autocontido, sem depender de arquivos externos.
  - type: script
    snippets:
      - |
        set -euo pipefail
        mkdir -p /usr/lib/bootc-image-builder
        tee /usr/lib/bootc-image-builder/iso.yaml >/dev/null <<'ISOYAML'
        label: "Fabulinux-Live"
        grub2:
          timeout: 10
          entries:
            - name: "Fabulinux Live"
              linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=Fabulinux-Live enforcing=0 rd.live.image"
              initrd: "/images/pxeboot/initrd.img"
            - name: "Fabulinux Live (modo grafico seguro)"
              linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=Fabulinux-Live enforcing=0 rd.live.image nomodeset"
              initrd: "/images/pxeboot/initrd.img"
        ISOYAML

  # --- Identidade: nome do sistema (card #20) ---
  # Faz `cat /etc/os-release` mostrar Fabulinux em vez de Fedora. NÃO mexemos em
  # ID (mudar ID quebra COPR/rpm-ostree). Rodado por último, como recomenda a doc.
  - type: os-release
    properties:
      NAME: Fabulinux
      PRETTY_NAME: "Fabulinux (base Fedora Kinoite)"
      VARIANT: Fabulinux
      VARIANT_ID: fabulinux
      HOME_URL: "https://fabulinux-os.github.io/fabulinux/"
      DOCUMENTATION_URL: "https://github.com/fabulinux-os/fabulinux"
      SUPPORT_URL: "https://github.com/fabulinux-os/fabulinux/issues"
      BUG_REPORT_URL: "https://github.com/fabulinux-os/fabulinux/issues"
