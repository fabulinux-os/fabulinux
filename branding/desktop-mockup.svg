    <linearGradient id="gPavL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A2E6B"/><stop offset="1" stop-color="#2A1A45"/></linearGradient>
    <linearGradient id="gPavR" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CDA6E4"/><stop offset="1" stop-color="#8557AC"/></linearGradient>
