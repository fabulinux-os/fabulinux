    <radialGradient id="wallGlow" cx="76%" cy="12%" r="60%">
      <stop offset="0" stop-color="rgba(155,89,182,.42)"/><stop offset="1" stop-color="rgba(155,89,182,0)"/>
    </radialGradient>
    <linearGradient id="gTable" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B981D6"/><stop offset="1" stop-color="#7B4A9E"/></linearGradient>
    <linearGradient id="gLeft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5E3A86"/><stop offset="1" stop-color="#38235C"/></linearGradient>
    <linearGradient id="gRight" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAD1F4"/><stop offset="1" stop-color="#B98CDA"/></linearGradient>
