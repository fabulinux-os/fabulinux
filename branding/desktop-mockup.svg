      <!-- item 3 -->
      <text x="674" y="350" font-size="15" font-weight="600" fill="#33263f">Newsletter Criativa</text>
      <text x="1186" y="350" font-size="12" fill="#9a8caa" text-anchor="end">seg</text>
      <text x="674" y="372" font-size="14" fill="#7a6d8a">10 paletas para inspirar sua semana</text>
      <line x1="650" y1="324" x2="1210" y2="324" stroke="#EFE4F5"/>
      <line x1="650" y1="396" x2="1210" y2="396" stroke="#EFE4F5"/>
