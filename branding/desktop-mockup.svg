  <!-- WALLPAPER -->
  <rect width="1600" height="1000" fill="url(#wall)"/>
  <rect width="1600" height="1000" fill="url(#wallGlow)"/>
  <g fill="none" stroke="rgba(201,160,222,.08)" stroke-width="1.5">
